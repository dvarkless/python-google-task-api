[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtasks"
version = "0.1.1"
description = "Minimal stdlib-only Python client for the Google Tasks REST API v1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gtasks = "gtasks.cli:run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
